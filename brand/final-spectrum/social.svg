  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="68" y="284" fill="#F3F1EC" font-size="44" font-weight="600">Your inbox, minus the noise.</text>
    <text x="68" y="340" fill="#A19E96" font-size="24">Headers only. Plan first. Undo every move.</text>
    <text x="68" y="392" fill="#FFB38A" font-size="22" font-weight="600">Tu bandeja, sin el ruido.</text>
