    <text x="414" y="456" text-anchor="middle" fill="#F3F1EC" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">PYTHON CLI ENGINE</text>
    <path d="M68 502 H716" stroke="#2A2C31" stroke-width="2"/>
    <text x="68" y="540" fill="#A19E96" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="1.4">LOCAL BY CONSTRUCTION · NO TELEMETRY · MIT</text>
    <text x="68" y="572" fill="#F3F1EC" font-size="15">Reversible moves with journal verification. Separate, irreversible unsubscribe.</text>
  </g>
