    <text x="862" y="402" fill="#F3F1EC" font-size="20" font-weight="600">Separate unsubscribe</text>
    <text x="862" y="428" fill="#A19E96" font-size="15">Explicitly isolated because unsubscribe is irreversible.</text>
    <path d="M812 468 H1184" stroke="#2A2C31" stroke-width="2"/>
