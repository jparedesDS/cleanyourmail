    <circle cx="828" cy="196" r="14" fill="#FFB38A"/>
    <text x="828" y="201" text-anchor="middle" fill="#121316" font-size="13" font-weight="700">1</text>
    <text x="862" y="202" fill="#F3F1EC" font-size="20" font-weight="600">Review the plan</text>
    <text x="862" y="228" fill="#A19E96" font-size="15">Headers only; protected mail stays untouched.</text>
    <circle cx="828" cy="296" r="14" fill="#A8E6CF"/>
    <text x="828" y="301" text-anchor="middle" fill="#121316" font-size="13" font-weight="700">2</text>
    <text x="862" y="302" fill="#F3F1EC" font-size="20" font-weight="600">Journal &amp; undo moves</text>
    <text x="862" y="328" fill="#A19E96" font-size="15">Every move verified by Message-ID on restore.</text>
    <circle cx="828" cy="396" r="14" fill="#FFE08A"/>
