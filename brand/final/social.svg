  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="68" y="284" fill="#eef8ee" font-size="44" font-weight="600">Your inbox, minus the noise.</text>
    <text x="68" y="340" fill="#9eb4a7" font-size="24">Headers only. Plan first. Undo every move.</text>
    <text x="68" y="392" fill="#6ee7c8" font-size="22">Tu bandeja, sin el ruido.</text>
    <rect x="68" y="432" width="236" height="36" rx="18" fill="#0d1a15" stroke="#11231b" stroke-width="2"/>
    <text x="186" y="455" text-anchor="middle" fill="#b9f36a" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">LOCAL DESKTOP APP</text>
    <rect x="318" y="432" width="204" height="36" rx="18" fill="#0d1a15" stroke="#11231b" stroke-width="2"/>
    <text x="420" y="455" text-anchor="middle" fill="#6ee7c8" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">PYTHON CLI ENGINE</text>
    <path d="M68 500 H716" stroke="#11231b" stroke-width="2"/>
    <text x="68" y="538" fill="#6f8578" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="1.4">LOCAL BY CONSTRUCTION · NO TELEMETRY · MIT</text>
    <text x="68" y="570" fill="#9eb4a7" font-size="15">Reversible moves with journal verification. Separate, irreversible unsubscribe.</text>
  </g>
