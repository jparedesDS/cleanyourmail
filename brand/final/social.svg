  <text x="872" y="85" fill="#9eb4a7" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.2">CLEANYOURMAIL · PLAN &amp; JOURNAL</text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="816" y="148" fill="#b9f36a" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.8">THE REVERSIBLE MOVE LOOP</text>
    <path d="M832 196 V396" stroke="#11231b" stroke-width="4"/>
    <circle cx="832" cy="196" r="14" fill="#6ee7c8"/>
    <text x="832" y="201" text-anchor="middle" fill="#07100d" font-size="13" font-weight="700">1</text>
    <text x="866" y="202" fill="#eef8ee" font-size="20" font-weight="600">Scan headers only</text>
    <text x="866" y="228" fill="#9eb4a7" font-size="15">Sender, subject, date, size, flags, unsubscribe.</text>
    <circle cx="832" cy="296" r="14" fill="#b9f36a"/>
    <text x="832" y="301" text-anchor="middle" fill="#07100d" font-size="13" font-weight="700">2</text>
    <text x="866" y="302" fill="#eef8ee" font-size="20" font-weight="600">Review the plan</text>
    <text x="866" y="328" fill="#9eb4a7" font-size="15">Protected mail stays untouched; no permanent delete.</text>
    <circle cx="832" cy="396" r="14" fill="#6ee7c8"/>
    <text x="832" y="401" text-anchor="middle" fill="#07100d" font-size="13" font-weight="700">3</text>
    <text x="866" y="402" fill="#eef8ee" font-size="20" font-weight="600">Undo every move</text>
    <text x="866" y="428" fill="#9eb4a7" font-size="15">Append-only journal verifies Message-ID on restore.</text>
    <path d="M816 468 H1184" stroke="#11231b" stroke-width="2"/>
    <text x="816" y="510" fill="#b9f36a" font-size="20" font-weight="600">Control, not magic.</text>
    <text x="816" y="540" fill="#6f8578" font-size="14">Local desktop app + Python CLI engine.</text>
