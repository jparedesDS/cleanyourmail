name: Bug report
description: Something is broken, refused, or behaving differently than documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real email addresses, Message-IDs, passwords, OAuth tokens, cookies or
        screenshots of a real inbox. Redact them first. For security issues, use SECURITY.md.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Gmail
        - Outlook.com / Microsoft 365
        - Yahoo
        - iCloud
        - Fastmail
        - Proton Bridge
        - Custom IMAP
        - Not provider-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python tools/mail.py --version`.
      placeholder: CleanYourMail 1.0.1
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with addresses redacted.
      placeholder: python tools/mail.py apply plan.json --yes --action move
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the exit code and the error text, with secrets and addresses redacted.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Capabilities and special folders only. Redact the account and server host if needed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I redacted addresses, Message-IDs, tokens and cookies.
          required: true
        - label: I did not point a test at a real account.
          required: true
        - label: This is not a security issue (those go through SECURITY.md).
          required: true
